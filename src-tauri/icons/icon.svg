<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- parallelist: workspaces cascading back, the front one showing its branch. 64 px and up; icon-small.svg is drawn for 16 and 32. -->
  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7189FF"/>
      <stop offset="1" stop-color="#4636D8"/>
    </linearGradient>
    <!-- The drop shadow from Apple's macOS icon template. -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feFlood flood-color="#1B1464" flood-opacity="0.35"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feComposite operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- The 824 px body of Apple's 1024 px grid: corner radius 22.5%, smoothed 60% into a continuous curve. -->
  <path fill="url(#body)" filter="url(#shadow)" d="M627.36 100c103.83 0 155.75 0 195.41 20.21a185.4 185.4 0 0 1 81.02 81.02c20.21 39.66 20.21 91.58 20.21 195.41L924 627.36c0 103.83 0 155.75 -20.21 195.41a185.4 185.4 0 0 1 -81.02 81.02c-39.66 20.21 -91.58 20.21 -195.41 20.21L396.64 924c-103.83 0 -155.75 0 -195.41 -20.21a185.4 185.4 0 0 1 -81.02 -81.02c-20.21 -39.66 -20.21 -91.58 -20.21 -195.41L100 396.64c0 -103.83 0 -155.75 20.21 -195.41a185.4 185.4 0 0 1 81.02 -81.02c39.66 -20.21 91.58 -20.21 195.41 -20.21Z"/>
  <g transform="translate(28 8)">
    <rect x="350" y="250" width="444" height="340" rx="40" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="290" y="310" width="444" height="340" rx="40" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="230" y="370" width="444" height="340" rx="40" fill="#FFFFFF" filter="url(#lift)"/>
    <g fill="#4636D8" fill-opacity="0.35">
      <circle cx="276" cy="412" r="11"/>
      <circle cx="310" cy="412" r="11"/>
      <circle cx="344" cy="412" r="11"/>
    </g>
    <path d="M330 660V470M330 600C330 540 380 530 440 530H560" fill="none" stroke="#4F46E5" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#4F46E5">
      <circle cx="330" cy="660" r="28"/>
      <circle cx="330" cy="470" r="28"/>
      <circle cx="560" cy="530" r="28"/>
    </g>
  </g>
</svg>
