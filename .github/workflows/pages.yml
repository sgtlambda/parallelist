# Publishes site/ to GitHub Pages whenever it changes on main. The page embeds
# the app's own frontend, built against a scripted backend (demo/), so changes
# to that or to src/ publish it too.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, src/**, demo/**, package.json, pnpm-lock.yaml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Into site/demo, which the landing page embeds.
      - run: pnpm build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
